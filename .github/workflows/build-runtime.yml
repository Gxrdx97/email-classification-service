name: Build PHP-FPM Runtime

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-runtime:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute runtime image name
        id: image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "repository=ghcr.io/${owner}/email-classification-service/php-runtime" >> "$GITHUB_OUTPUT"
          echo "tag=sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-8)" >> "$GITHUB_OUTPUT"

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish PHP 8.4/FPM runtime
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          target: runtime
          push: true
          build-args: |
            PHP_RUNTIME_IMAGE=php:8.4-fpm-bookworm
            INSTALL_RUNTIME=1
          tags: |
            ${{ steps.image.outputs.repository }}:8.4
            ${{ steps.image.outputs.repository }}:${{ steps.image.outputs.tag }}
          cache-from: type=gha,scope=php-runtime
          cache-to: type=gha,mode=max,scope=php-runtime
