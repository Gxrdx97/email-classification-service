name: CD — Deploy Staging

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: email-classification-service-deployment
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      image_repository: ${{ steps.image.outputs.repository }}
      image_tag: ${{ steps.image.outputs.tag }}
      app_image: ${{ steps.image.outputs.app_image }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute immutable application image
        id: image
        env:
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          owner="$(printf '%s' "$REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')"
          repository="ghcr.io/${owner}/email-classification-service"
          tag="sha-$(printf '%s' "$GITHUB_SHA" | cut -c1-8)"
          echo "repository=${repository}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "app_image=${repository}:${tag}" >> "$GITHUB_OUTPUT"

      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish application image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/app/Dockerfile
          target: production
          push: true
          build-args: |
            PHP_RUNTIME_IMAGE=${{ steps.image.outputs.repository }}/php-runtime:8.4
            INSTALL_RUNTIME=0
          tags: |
            ${{ steps.image.outputs.app_image }}
            ${{ steps.image.outputs.repository }}:staging
          cache-from: type=gha,scope=application
          cache-to: type=gha,mode=max,scope=application

  migrate-staging:
    needs: build
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4

      - name: Sync deploy Compose file
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.deploy.yml
          target: /opt/email-classification-service
          overwrite: true

      - name: Prepare database and apply release migrations
        uses: appleboy/ssh-action@v1
        env:
          APP_IMAGE: ${{ needs.build.outputs.app_image }}
          DEPLOY_ENV_FILE: .env.staging
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: APP_IMAGE,DEPLOY_ENV_FILE
          script: |
            set -eu
            cd /opt/email-classification-service
            docker compose --env-file "$DEPLOY_ENV_FILE" -p email-classification-service-staging -f docker-compose.deploy.yml pull app
            docker compose --env-file "$DEPLOY_ENV_FILE" -p email-classification-service-staging -f docker-compose.deploy.yml up -d --no-deps pgsql redis
            ready=0
            for attempt in $(seq 1 60); do
              if docker compose --env-file "$DEPLOY_ENV_FILE" -p email-classification-service-staging -f docker-compose.deploy.yml exec -T pgsql pg_isready -q; then
                ready=1
                break
              fi
              sleep 5
            done
            if [ "$ready" -ne 1 ]; then
              echo "PostgreSQL staging não ficou pronto" >&2
              exit 1
            fi
            docker compose --env-file "$DEPLOY_ENV_FILE" -p email-classification-service-staging -f docker-compose.deploy.yml run --rm --no-deps -e LARAVEL_CONFIG_CACHE=false app php artisan config:cache
            docker compose --env-file "$DEPLOY_ENV_FILE" -p email-classification-service-staging -f docker-compose.deploy.yml run --rm --no-deps -e LARAVEL_CONFIG_CACHE=false app php artisan migrate --force

  deploy-staging:
    needs: [build, migrate-staging]
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - name: Deploy immutable image
        uses: appleboy/ssh-action@v1
        env:
          APP_IMAGE: ${{ needs.build.outputs.app_image }}
          DEPLOY_ENV_FILE: .env.staging
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: APP_IMAGE,DEPLOY_ENV_FILE
          script: |
            set -eu
            cd /opt/email-classification-service
            docker compose --env-file "$DEPLOY_ENV_FILE" -p email-classification-service-staging -f docker-compose.deploy.yml pull app web worker scheduler
            docker compose --env-file "$DEPLOY_ENV_FILE" -p email-classification-service-staging -f docker-compose.deploy.yml up -d --remove-orphans app web worker scheduler

      - name: Wait for public health gates
        env:
          DEPLOY_BASE_URL: ${{ secrets.DEPLOY_BASE_URL }}
        run: |
          set -euo pipefail
          : "${DEPLOY_BASE_URL:?DEPLOY_BASE_URL must be configured in the staging environment}"
          base_url="${DEPLOY_BASE_URL%/}"
          for path in /api/health/live /api/health/ready; do
            healthy=0
            for attempt in $(seq 1 60); do
              status="$(curl --silent --output /dev/null --write-out '%{http_code}' --connect-timeout 5 --max-time 15 "${base_url}${path}" 2>/dev/null || true)"
              if [ "$status" = "200" ]; then
                healthy=1
                break
              fi
              sleep 10
            done
            if [ "$healthy" -ne 1 ]; then
              echo "::error::Health gate falhou em ${path} (status=${status:-indisponível})"
              exit 1
            fi
          done
